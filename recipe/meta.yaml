{% set name = "nvidia-ml-py" %}
{% set version = "13.580.82" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 0c028805dc53a0e2a6985ea801888197765ac2ef8f1c9e29a7bf0d3616a5efc7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
  run_constrained:
    # Packages that conflict with nvidia-ml-py
    # Both packages install pynvml.py
    - nvidia-ml ==9999999999
    - pynvml ==9999999999

test:
  imports:
    - pynvml
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://developer.nvidia.com/nvidia-management-library-nvml
  summary: Python Bindings for the NVIDIA Management Library
  description: Python Bindings for the NVIDIA Management Library
  license: BSD-3-Clause
  license_family: BSD
  license_file: PKG-INFO
  dev_url: https://developer.nvidia.com/nvidia-management-library-nvml
  doc_url: https://docs.nvidia.com/deploy/nvml-api/index.html

extra:
  recipe-maintainers:
    - XuehaiPan
